name: npm package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run npm:prepare
      - run: npm pack ./dist/npm --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm/
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - run: npm publish ./dist/npm --access public --provenance
